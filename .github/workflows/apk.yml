name: Build Medora APK v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android app
        run: |
          mkdir www && cp medora.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init Medora com.medora.app --web-dir=www
          npx cap add android
      - name: Make ringtones
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave,struct,math
          T={"classic":("sine",.22,[(880,0),(880,.3),(880,.6)]),
          "chime":("triangle",.5,[(523,0),(659,.25),(784,.5),(1047,.75)]),
          "melody":("triangle",.25,[(523,0),(587,.2),(659,.4),(523,.6),(659,.8),(784,1)]),
          "siren":("square",.33,[(600,0),(900,.35),(600,.7),(900,1.05)]),
          "digital":("square",.1,[(1200,0),(1200,.18),(1200,.36),(1200,.8),(1200,.98),(1200,1.16)]),
          "bell":("sine",.9,[(392,0),(392,.9),(392,1.8)])}
          sr=22050;tot=sr*10
          for k,(t,d,s) in T.items():
              buf=[0.0]*tot;L=max(x[1] for x in s)+d+1.0;rep=0;amp=.45 if t=="square" else .8
              while rep*L<10:
                  for f,st in s:
                      a=int((rep*L+st)*sr);n=int(d*sr)
                      for i in range(n):
                          j=a+i
                          if j>=tot:break
                          ph=2*math.pi*f*i/sr
                          w=math.sin(ph) if t=="sine" else (2/math.pi*math.asin(math.sin(ph)) if t=="triangle" else (1 if math.sin(ph)>=0 else -1))
                          buf[j]+=w*min(1,i/(.01*sr))*math.exp(-3*i/n)*amp
                  rep+=1
              with wave.open("android/app/src/main/res/raw/"+k+".wav","wb") as o:
                  o.setnchannels(1);o.setsampwidth(2);o.setframerate(sr)
                  o.writeframes(b"".join(struct.pack("<h",int(max(-1,min(1,x))*32000)) for x in buf))
          PY
      - name: Make app icon
        run: |
          pip install --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 - <<'PY'
          import glob,os,sys
          from PIL import Image
          res="android/app/src/main/res"
          fs=sorted(glob.glob("*.png"))
          if not fs:
              print("No png icon found, skipping icon");sys.exit(0)
          src=Image.open(fs[0]).convert("RGBA")
          w,h=src.size
          c1=src.getpixel((int(w*.2),int(h*.12)))[:3];c2=src.getpixel((int(w*.8),int(h*.92)))[:3]
          D={"mdpi":(48,108),"hdpi":(72,162),"xhdpi":(96,216),"xxhdpi":(144,324),"xxxhdpi":(192,432)}
          for d,(l,f) in D.items():
              p=os.path.join(res,"mipmap-"+d);os.makedirs(p,exist_ok=True)
              for n in("ic_launcher.png","ic_launcher_round.png"):src.resize((l,l),Image.LANCZOS).save(os.path.join(p,n))
              bg=Image.new("RGB",(f,f))
              for y in range(f):
                  for x in range(f):
                      t=(x+y)/(2*f-2);bg.putpixel((x,y),tuple(int(c1[i]+(c2[i]-c1[i])*t) for i in range(3)))
              bg.save(os.path.join(p,"medora_bg.png"))
              fg=Image.new("RGBA",(f,f),(0,0,0,0));s=int(f*.64)
              fg.paste(src.resize((s,s),Image.LANCZOS),((f-s)//2,(f-s)//2));fg.save(os.path.join(p,"medora_fg.png"))
          ad=os.path.join(res,"mipmap-anydpi-v26");os.makedirs(ad,exist_ok=True)
          x='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@mipmap/medora_bg"/>\n<foreground android:drawable="@mipmap/medora_fg"/>\n</adaptive-icon>\n'
          for n in("ic_launcher.xml","ic_launcher_round.xml"):open(os.path.join(ad,n),"w").write(x)
          print("icon ok",c1,c2)
          PY
      - name: Add permissions and sync
        run: |
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          add="".join('    <uses-permission android:name="android.permission.%s"/>\n'%n for n in ("POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","VIBRATE","WAKE_LOCK","RECEIVE_BOOT_COMPLETED"))
          i=s.index("<application")
          open(p,"w").write(s[:i]+add+"    "+s[i:])
          PY
          npx cap sync android
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Medora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
